name: build-wheels

# Build the Rust extension wheel (crates/dwa_extractors) for Linux,
# macOS, and Windows. Runs on every push to a feature branch + on tags.
# Wheels attach to a GitHub Release on a v* tag.
on:
  push:
    branches: [main, claude/setup-threat-intel-platform-uWzhb]
    tags: ['v*']
  pull_request:
    paths:
      - 'crates/dwa_extractors/**'
      - '.github/workflows/build-wheels.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 'auto'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: 'auto'
          - os: macos-latest
            target: x86_64-apple-darwin
            manylinux: 'off'
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: 'off'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/dwa_extractors
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}

      - name: Sanity-check wheel imports (host arch only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          pip install --upgrade pip
          pip install crates/dwa_extractors/dist/*.whl
          python -c "import dwa_extractors; print('version:', dwa_extractors.version())"
          python -c "
          import dwa_extractors as d
          out = d.extract_observables('CVE-2024-3400 at https://evil.example.com/ from alice@example.com on 10.0.0.1')
          types = {o['entity_type'] for o in out}
          assert {'cve', 'url', 'email', 'ip'}.issubset(types), out
          print('smoke ok:', types)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: crates/dwa_extractors/dist/*.whl

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/dwa_extractors
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/dwa_extractors/dist/*.tar.gz

  release:
    name: attach wheels to release
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
