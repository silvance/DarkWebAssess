watchlist:
  - type: domain
    value: example.com
    description: Example primary domain
    severity: high
    enabled: true

  - type: domain
    value: example.mil
    description: Example mil domain
    severity: critical
    enabled: true

  - type: email
    value: security@example.com
    description: Watched VIP email
    severity: high
    enabled: true

  - type: ip
    value: 192.0.2.1
    description: Example watched IP (TEST-NET)
    severity: medium
    enabled: true

  - type: cve
    value: CVE-2024-3400
    description: PAN-OS GlobalProtect command injection
    severity: critical
    enabled: true

  - type: keyword
    value: ransomware
    description: Generic ransomware keyword
    severity: low
    enabled: true

  - type: keyword
    value: zero-day
    description: Zero-day mentions
    severity: medium
    enabled: true

  - type: malware
    value: LockBit
    description: LockBit ransomware family
    severity: high
    enabled: true

  - type: actor
    value: Volt Typhoon
    description: PRC-aligned APT group
    severity: critical
    enabled: true

  - type: onion
    value: exampleexampleexampleexampleexampleexampleexampleexample00.onion
    description: Example v3 onion (placeholder)
    severity: high
    enabled: false

  - type: wallet
    value: bc1qexamplewalletaddressxxxxxxxxxxxxxxxxxxxxxx
    description: Example BTC bech32 wallet (placeholder)
    severity: medium
    enabled: false

  - type: handle
    value: "@example_actor"
    description: Example threat-actor handle (placeholder)
    severity: medium
    enabled: false

  # ----------------------------------------------------------------------
  # Leak-site indicator alerts (disabled by default).
  # The leak-listing extractor emits leak_status / leak_size / leak_deadline
  # entities for documents that look like ransomware-leak landings. These
  # keyword rules light up when those phrases appear in the source text.
  - type: keyword
    value: data published
    description: Ransomware leak status — data has been released
    severity: high
    enabled: false

  - type: keyword
    value: auction started
    description: Stolen-data auction has begun
    severity: high
    enabled: false

  - type: keyword
    value: deadline expired
    description: Ransomware deadline has passed
    severity: high
    enabled: false
