[package]
name = "dwa_extractors"
version = "0.1.0"
edition = "2021"
description = "Fast regex-based observable extractors for DarkWebAssess (Python via PyO3)."
license = "MIT"

[lib]
name = "dwa_extractors"
# cdylib for the Python wheel; rlib so we can write pure-Rust unit tests too.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
regex = "1.10"
once_cell = "1.19"

[profile.release]
# Smaller wheels + somewhat faster code. -Ctarget-cpu=native would be faster
# but we want portable wheels, so leave that off.
lto = "thin"
codegen-units = 1
strip = true
